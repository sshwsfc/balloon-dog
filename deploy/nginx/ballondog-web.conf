# bdog-web 容器的 nginx 配置（挂在 /etc/nginx/conf.d/default.conf）
#
# 它只做一件事：把 current 软链指向的那份静态产物按「两套 SPA + 一个下载目录」发出去。
# `/api` 不在这里反代 —— 边缘 nginx 直接指向 bdog-server:4000，少一跳。
#
# 注意 root 指向的是**软链**（releases/current → releases/<tag>）：
# 容器挂的是整个 releases 目录，nginx 每个请求自己解析软链，所以换版只要换链，
# 不用重建容器。反过来（直接挂 current）会踩 Docker 的老问题 —— 软链在容器启动时被
# 解析成真实 inode，之后换链容器仍看旧目录，删旧版时就成了空目录 / 403。

server {
    listen       80;
    server_name  _;
    charset      utf-8;

    root  /usr/share/nginx/html/current;
    index index.html;

    # 上传和下载都要能过：相册单文件上限 10MB、截屏批次 8MB，这里给 20MB 余量
    client_max_body_size 20m;

    gzip              on;
    gzip_min_length   1k;
    gzip_comp_level   6;
    gzip_vary         on;
    gzip_types        text/plain text/css application/javascript application/json application/xml image/svg+xml;

    # 单页应用的入口 HTML 不能缓存：否则家长升级后仍拿到旧 index.html，
    # 里面引用的 assets 文件名已经变了 → 白屏。
    add_header Cache-Control "no-cache" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "no-referrer-when-downgrade" always;

    # 带哈希的构建产物可以永久缓存
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, max-age=31536000, immutable" always;
        try_files $uri =404;
    }

    # 孩子端安装包：固定文件名（二维码/分享出去的链接已经钉死这个地址，不能改名）。
    # 版本进化靠内容更新，旧版留在 /download/archive/<版本>.apk 备查。
    location /download/ {
        default_type application/vnd.android.package-archive;
        add_header Cache-Control "no-cache" always;
        try_files $uri =404;
    }

    # 管理后台（/admin 是第二个 Vite 入口，base=/admin/）
    location /admin/ {
        try_files $uri $uri/ /admin/index.html;
    }

    # 家长端
    location / {
        try_files $uri $uri/ /index.html;
    }

    # 健康检查（给 docker healthcheck 用）
    location = /__health {
        access_log off;
        default_type text/plain;
        return 200 "ok\n";
    }
}
