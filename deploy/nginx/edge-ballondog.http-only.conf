# ─────────────────────────────────────────────────────────────────────────────
# 证书到位**之前**用的过渡版：只监听 80，直接反代，不做跳转。
#
# 用途：让 bdog.gtsiot.cn 先能打开（家长端、后台、APK 下载、API 全部通），
# 等证书（bdog.gtsiot.cn_bundle.pem + .key）放进
# /opt/app/airiot/web/ssl/bdog.gtsiot.cn_nginx/ 之后，把这一段换成同目录的
# edge-ballondog.snippet.conf（80 → 301 443 + TLS）。
#
# 注意：这一版是**明文 HTTP**，微信登录/支付回调都要求 https，所以它只是过渡态，
# 不该长期停在这份配置上。
# ─────────────────────────────────────────────────────────────────────────────

server {
    listen       80;
    server_name  bdog.gtsiot.cn;

    charset              utf-8;
    client_max_body_size 20m;

    proxy_http_version  1.1;
    proxy_set_header    Host              $host;
    proxy_set_header    X-Real-IP         $remote_addr;
    proxy_set_header    X-Forwarded-For   $proxy_add_x_forwarded_for;
    proxy_set_header    X-Forwarded-Proto $scheme;
    proxy_read_timeout  180s;
    proxy_send_timeout  180s;

    # 后端存活探测。注意后端的路由是 /health（不在 /api 下），
    # 所以这里必须单独给一条精确匹配，否则会落到前端静态资源上返回 index.html。
    location = /health {
        proxy_pass http://bdog-server:4000/health;
    }

    location /api/ {
        proxy_pass http://bdog-server:4000/api/;
    }

    location / {
        proxy_pass http://bdog-web:80;
    }
}
