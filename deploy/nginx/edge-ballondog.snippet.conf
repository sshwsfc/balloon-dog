# ─────────────────────────────────────────────────────────────────────────────
# 贴进「边缘 nginx」的 server 块（/opt/app/airiot/web/nginx.conf，容器 web）
#
# 这是**证书就位后**的最终形态：80 → 301 到 443，443 反代到本项目的两个容器。
# 证书没到位前先用同目录的 edge-ballondog.http-only.conf（80 直接反代），
# 这样站点能先跑通，拿到证书再换成这一份。
#
# 证书放宿主机 /opt/app/airiot/web/ssl/bdog.gtsiot.cn_nginx/（该目录已挂进 web 容器
# 的 /usr/local/nginx/cert/），保持与现有 gtsiot.cn / kesi.gtsiot.cn 同一套布局：
#     bdog.gtsiot.cn_bundle.pem   ← 证书链（含中间证书）
#     bdog.gtsiot.cn.key          ← 私钥
#
# 改法（每次都要做）：
#     cp nginx.conf nginx.conf.bak-$(date +%F-%H%M)
#     docker exec web nginx -t && docker exec web nginx -s reload
# ⚠️ `nginx -s reload` 是平滑重载，不影响现有站点；但 `nginx -t` 不通过时千万别 reload。
# ─────────────────────────────────────────────────────────────────────────────

server {
    listen       80;
    server_name  bdog.gtsiot.cn;

    # 证书签发/续期用的 http-01 校验目录（用 acme.sh webroot 模式时必须有）
    location /.well-known/acme-challenge/ {
        root /usr/share/nginx/html;
    }

    location / {
        return 301 https://$server_name$request_uri;
    }
}

server {
    listen       443 ssl;
    server_name  bdog.gtsiot.cn;

    ssl_certificate      /usr/local/nginx/cert/bdog.gtsiot.cn_nginx/bdog.gtsiot.cn_bundle.pem;
    ssl_certificate_key  /usr/local/nginx/cert/bdog.gtsiot.cn_nginx/bdog.gtsiot.cn.key;

    ssl_session_timeout  5m;
    # 这里**不**写 ssl_protocols / ssl_ciphers：同一台机器的 443 是所有站点共用的一个 socket，
    # nginx 只认第一个 server 块上的 TLS 策略，在这里写一遍只会得到
    # 「protocol options redefined for 0.0.0.0:443」的警告，实际并不生效。
    # 现在全站是 http 块里的 TLSv1 / 1.1 / 1.2（见 nginx.conf 第 51-52 行）。
    # 要收紧到 TLSv1.2+ 得改那几行 —— 那会影响 gtsiot / kesi / dsh 等所有站点，需要单独排期。

    keepalive_timeout       180;
    client_header_timeout   180;
    client_body_timeout     180;
    # 设备上传：相册单文件 10MB、截屏批次 8MB（与 server/.env.prod 的 MEDIA_* 对应）
    client_max_body_size    20m;
    charset                 utf-8;

    # 真实客户端 IP 要透传给后端（限流按 IP 计数、审计日志记 IP）
    # 该 map 已在边缘 nginx.conf 的 http 块里定义（第 38 行）
    proxy_http_version  1.1;
    proxy_set_header    Host              $host;
    proxy_set_header    X-Real-IP         $remote_addr;
    proxy_set_header    X-Forwarded-For   $proxy_add_x_forwarded_for;
    proxy_set_header    X-Forwarded-Proto $scheme;
    proxy_set_header    Upgrade           $http_upgrade;
    proxy_set_header    Connection        $connection_upgrade;
    # AI 洞察/分析是长请求（上游可能跑几十秒），别按默认 60s 掐断
    proxy_read_timeout  180s;
    proxy_send_timeout  180s;

    # 后端 API（含微信/支付宝回调、设备上报、媒体下载）
    # 后端存活探测。注意后端的路由是 /health（不在 /api 下），
    # 所以这里必须单独给一条精确匹配，否则会落到前端静态资源上返回 index.html。
    location = /health {
        proxy_pass http://bdog-server:4000/health;
    }

    location /api/ {
        proxy_pass http://bdog-server:4000/api/;
    }

    # 家长端 / 管理后台 / 孩子端安装包，全部由 bdog-web 发静态
    location / {
        proxy_pass http://bdog-web:80;
    }
}
